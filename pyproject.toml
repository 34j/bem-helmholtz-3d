[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "bem-helmholtz-3d"
version = "1.0.0"
description = "3D BEM for Helmholtz equation"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/34j/bem-helmholtz-3d/issues"
urls.Changelog = "https://github.com/34j/bem-helmholtz-3d/blob/main/CHANGELOG.md"
urls.documentation = "https://bem-helmholtz-3d.readthedocs.io"
urls.repository = "https://github.com/34j/bem-helmholtz-3d"
scripts.bem-helmholtz-3d = "bem_helmholtz_3d.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."tests/**/*" = [ "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
addopts = [
  "-v",
  "-Wonce",
  "-p no:doctest",
  "--cov=bem_helmholtz_3d",
  "--cov-report=term",
  "--cov-report=xml",
]
pythonpath = [ "src" ]
